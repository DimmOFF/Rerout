[workspace]
resolver = "2"
members = ["crates/common", "crates/inject", "crates/hook", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.59"

[profile.release]
lto = true
codegen-units = 1
strip = true
